name: Android shared signing

on:
  workflow_call:
    inputs:
      project-dir:
        required: false
        type: string
        default: "."
      gradle-task:
        required: false
        type: string
        default: "assembleRelease"
    secrets:
      ANDROID_SIGNING_KEYSTORE_BASE64:
        required: true
      ANDROID_SIGNING_STORE_PASSWORD:
        required: true
      ANDROID_SIGNING_KEY_ALIAS:
        required: true
      ANDROID_SIGNING_KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build-sign:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Decode, validate, and normalize shared signing key
        env:
          KS: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KS" || { echo "ERROR: signing keystore secret is empty."; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ERROR: keystore password secret is empty."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ERROR: key alias secret is empty."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ERROR: private-key password secret is empty."; exit 1; }

          printf '%s' "$KS" | tr -d '[:space:]' | base64 --decode > release.jks
          chmod 600 release.jks

          if ! keytool -list -keystore release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>"$RUNNER_TEMP/keystore-check.log"; then
            echo "ERROR: Cannot open the signing keystore or find the configured alias."
            echo "Check ANDROID_SIGNING_KEYSTORE_BASE64, ANDROID_SIGNING_STORE_PASSWORD, and ANDROID_SIGNING_KEY_ALIAS in khahdihdz/apksign."
            exit 1
          fi

          # The uploaded keystore may be JKS or PKCS12 regardless of its filename.
          # Try both source formats and both common key-password configurations.
          # The output PKCS12 uses the store password for both store and key.
          normalized="$RUNNER_TEMP/release-signing.p12"
          imported=false
          for source_type in JKS PKCS12; do
            for source_key_password in "$KEY_PASSWORD" "$STORE_PASSWORD"; do
              rm -f "$normalized"
              if keytool -importkeystore \
                -srckeystore release.jks \
                -srcstoretype "$source_type" \
                -srcstorepass "$STORE_PASSWORD" \
                -srcalias "$KEY_ALIAS" \
                -srckeypass "$source_key_password" \
                -destkeystore "$normalized" \
                -deststoretype PKCS12 \
                -deststorepass "$STORE_PASSWORD" \
                -destalias "$KEY_ALIAS" \
                -destkeypass "$STORE_PASSWORD" \
                -noprompt >/dev/null 2>"$RUNNER_TEMP/key-password-check.log"; then
                if keytool -list -keystore "$normalized" -storetype PKCS12 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
                  imported=true
                  break 2
                fi
              fi
            done
          done

          if [ "$imported" != true ]; then
            echo "ERROR: Signing keystore was decoded and its store password/alias were accepted, but the private key could not be imported."
            echo "Tried source formats JKS and PKCS12, with the configured key password and store password."
            echo "Verify ANDROID_SIGNING_KEY_PASSWORD matches this exact keystore. Do not replace the keystore if you need to preserve app update compatibility."
            exit 1
          fi
          chmod 600 "$normalized"
          echo "Signing keystore validated and normalized to PKCS12."


      - name: Build release
        run: ./gradlew ${{ inputs.gradle-task }}

      - name: Install Android Build Tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_bin" ]; then
            sdkmanager_bin="$(command -v sdkmanager)"
          fi
          test -x "$sdkmanager_bin"
          "$sdkmanager_bin" --licenses < <(yes) >/dev/null
          "$sdkmanager_bin" --install "platform-tools" "build-tools;35.0.0"

      - name: Add Android Build Tools to PATH
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$tools_dir/zipalign"
          test -x "$tools_dir/apksigner"
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Sign release APKs
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release-signing.p12"
          test -s "$keystore" || { echo "ERROR: normalized signing keystore is missing."; exit 1; }

          mapfile -t apks < <(find . -type f -path '*/build/outputs/apk/release/*.apk' ! -path './signed-apks/*' -print | sort)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No release APK found under any */build/outputs/apk/release/ directory."
            find . -path '*/build/outputs/apk/*/*.apk' -print || true
            exit 1
          fi

          mkdir -p signed-apks
          for apk in "${apks[@]}"; do
            name="$(basename "$apk")"
            aligned="signed-apks/${name%.apk}-aligned.apk"
            signed="signed-apks/${name%.apk}-signed.apk"
            zipalign -f -p 4 "$apk" "$aligned"
            apksigner sign \
              --ks "$keystore" \
              --ks-type PKCS12 \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:STORE_PASSWORD \
              --key-pass env:STORE_PASSWORD \
              --out "$signed" \
              "$aligned"
            apksigner verify --verbose --print-certs "$signed"
          done

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-apks
          path: ${{ inputs.project-dir }}/signed-apks/*-signed.apk
          if-no-files-found: error
