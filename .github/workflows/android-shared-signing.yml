name: Android shared signing

on:
  workflow_call:
    inputs:
      project-dir:
        required: false
        type: string
        default: "."
      gradle-task:
        required: false
        type: string
        default: "assembleRelease"
    secrets:
      ANDROID_SIGNING_KEYSTORE_BASE64:
        required: true
      ANDROID_SIGNING_STORE_PASSWORD:
        required: true
      ANDROID_SIGNING_KEY_ALIAS:
        required: true
      ANDROID_SIGNING_KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build-sign:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Decode, validate, and normalize shared signing key
        env:
          KS: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KS" || { echo "ERROR: signing keystore secret is empty."; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ERROR: keystore password secret is empty."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ERROR: key alias secret is empty."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ERROR: private-key password secret is empty."; exit 1; }

          printf '%s' "$KS" | tr -d '[:space:]' | base64 --decode > release.jks
          chmod 600 release.jks

          if ! keytool -list -keystore release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>"$RUNNER_TEMP/keystore-check.log"; then
            echo "ERROR: Cannot open the signing keystore or find the configured alias."
            echo "Check ANDROID_SIGNING_KEYSTORE_BASE64, ANDROID_SIGNING_STORE_PASSWORD, and ANDROID_SIGNING_KEY_ALIAS in khahdihdz/apksign."
            exit 1
          fi

          # Normalize the validated private key into PKCS12 and use this exact
          # file for signing, rather than validating a conversion and then
          # asking apksigner to reopen the original keystore.
          if ! keytool -importkeystore \
            -srckeystore release.jks \
            -srcstoretype JKS \
            -srcstorepass "$STORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore "$RUNNER_TEMP/release-signing.p12" \
            -deststoretype PKCS12 \
            -deststorepass "$STORE_PASSWORD" \
            -destalias "$KEY_ALIAS" \
            -destkeypass "$KEY_PASSWORD" \
            -noprompt >/dev/null 2>"$RUNNER_TEMP/key-password-check.log"; then
            echo "ERROR: Could not import the private key. Check the keystore and private-key password secrets in khahdihdz/apksign."
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/release-signing.p12"

          if ! keytool -list -keystore "$RUNNER_TEMP/release-signing.p12" -storetype PKCS12 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "ERROR: Normalized PKCS12 keystore validation failed."
            exit 1
          fi
          echo "Signing keystore and private key validated and normalized."

      - name: Build release
        run: ./gradlew ${{ inputs.gradle-task }}

      - name: Install Android Build Tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_bin" ]; then
            sdkmanager_bin="$(command -v sdkmanager)"
          fi
          test -x "$sdkmanager_bin"
          "$sdkmanager_bin" --licenses < <(yes) >/dev/null
          "$sdkmanager_bin" --install "platform-tools" "build-tools;35.0.0"

      - name: Add Android Build Tools to PATH
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$tools_dir/zipalign"
          test -x "$tools_dir/apksigner"
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Sign release APKs
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release-signing.p12"
          test -s "$keystore" || { echo "ERROR: normalized signing keystore is missing."; exit 1; }

          mapfile -t apks < <(find . -type f -path '*/build/outputs/apk/release/*.apk' ! -path './signed-apks/*' -print | sort)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No release APK found under any */build/outputs/apk/release/ directory."
            find . -path '*/build/outputs/apk/*/*.apk' -print || true
            exit 1
          fi

          mkdir -p signed-apks
          for apk in "${apks[@]}"; do
            name="$(basename "$apk")"
            aligned="signed-apks/${name%.apk}-aligned.apk"
            signed="signed-apks/${name%.apk}-signed.apk"
            zipalign -f -p 4 "$apk" "$aligned"
            apksigner sign \
              --ks "$keystore" \
              --ks-type PKCS12 \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:STORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "$signed" \
              "$aligned"
            apksigner verify --verbose --print-certs "$signed"
          done

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-apks
          path: ${{ inputs.project-dir }}/signed-apks/*-signed.apk
          if-no-files-found: error
