name: Android shared signing

on:
  workflow_call:
    inputs:
      project-dir:
        required: false
        type: string
        default: "."
      gradle-task:
        required: false
        type: string
        default: "assembleRelease"
    secrets:
      ANDROID_SIGNING_KEYSTORE_BASE64:
        required: true
      ANDROID_SIGNING_STORE_PASSWORD:
        required: true
      ANDROID_SIGNING_KEY_ALIAS:
        required: true
      ANDROID_SIGNING_KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build-sign:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.project-dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build release
        run: ./gradlew ${{ inputs.gradle-task }}

      - name: Install Android Build Tools
        uses: android-actions/setup-android@v3

      - name: Decode shared signing key
        env:
          KS: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$KS"
          printf '%s' "$KS" | base64 --decode > release.jks
          chmod 600 release.jks

      - name: Sign release APKs
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No release APK found under build/outputs/apk/release/"
            find . -path '*/build/outputs/apk/*/*.apk' -print || true
            exit 1
          fi

          mkdir -p signed-apks
          for apk in "${apks[@]}"; do
            name="$(basename "$apk")"
            aligned="signed-apks/${name%.apk}-aligned.apk"
            signed="signed-apks/${name%.apk}-signed.apk"
            zipalign -f -p 4 "$apk" "$aligned"
            apksigner sign \
              --ks release.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:STORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "$signed" \
              "$aligned"
            apksigner verify --verbose --print-certs "$signed"
          done

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-apks
          path: ${{ inputs.project-dir }}/signed-apks/*-signed.apk
          if-no-files-found: error
