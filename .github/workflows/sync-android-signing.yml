name: Sync Android signing to all repositories

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          TOKEN: ${{ secrets.APKSIGN_SYNC_TOKEN }}
          KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$TOKEN"
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Sync signing secrets
        env:
          GH_TOKEN: ${{ secrets.APKSIGN_SYNC_TOKEN }}
          KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          owner="khahdihdz"
          central="khahdihdz/apksign"

          gh repo list "$owner" --limit 1000 --json nameWithOwner,isArchived \
            --jq '.[] | select(.isArchived == false) | .nameWithOwner' > repos.txt

          while IFS= read -r repo; do
            [ "$repo" = "$central" ] && continue

            default_branch="$(gh api "repos/$repo" --jq '.default_branch')"
            tree="$(gh api "repos/$repo/git/trees/$default_branch?recursive=1" 2>/dev/null || true)"
            [ -n "$tree" ] || continue

            manifest="$(printf '%s' "$tree" | jq -r '
              .tree[]?
              | select(.type == "blob")
              | select(.path | endswith("src/main/AndroidManifest.xml"))
              | .path
            ' | head -n 1)"

            [ -n "$manifest" ] || continue

            echo "Syncing Android signing secrets to $repo"

            gh secret set ANDROID_SIGNING_KEYSTORE_BASE64 --repo "$repo" --body "$KEYSTORE"
            gh secret set ANDROID_SIGNING_STORE_PASSWORD --repo "$repo" --body "$STORE_PASSWORD"
            gh secret set ANDROID_SIGNING_KEY_ALIAS --repo "$repo" --body "$KEY_ALIAS"
            gh secret set ANDROID_SIGNING_KEY_PASSWORD --repo "$repo" --body "$KEY_PASSWORD"

            echo "Synced: $repo"
          done < repos.txt
