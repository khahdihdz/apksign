name: Sync Android signing to all repositories

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          TOKEN: ${{ secrets.APKSIGN_SYNC_TOKEN }}
          KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$TOKEN"
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS" || true
          test -n "$KEY_PASSWORD"

      - name: Validate source keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail

          KEY_ALIAS="${KEY_ALIAS:-khahdihdz-release}"
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"

          KS="$RUNNER_TEMP/source-signing.jks"
          CLEAN_B64="$RUNNER_TEMP/source-signing.b64"

          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' > "$CLEAN_B64"
          B64="$(cat "$CLEAN_B64")"

          if ! printf '%s' "$B64" | grep -Eq '^[A-Za-z0-9+/]*={0,2}$'; then
            echo "ERROR: ANDROID_SIGNING_KEYSTORE_BASE64 contains invalid Base64 characters."
            exit 1
          fi

          b64_length="$(expr length "$B64")"
          remainder=$((b64_length % 4))
          if [ "$remainder" -eq 1 ]; then
            echo "ERROR: ANDROID_SIGNING_KEYSTORE_BASE64 has an invalid Base64 length."
            exit 1
          elif [ "$remainder" -eq 2 ]; then
            B64="$B64=="
          elif [ "$remainder" -eq 3 ]; then
            B64="$B64="
          fi

          if ! printf '%s' "$B64" | base64 --decode > "$KS" 2>"$RUNNER_TEMP/base64-error.txt"; then
            echo "ERROR: Base64 decoding failed."
            cat "$RUNNER_TEMP/base64-error.txt"
            exit 1
          fi
          chmod 600 "$KS"

          echo "Inspecting source keystore metadata (secret values are not printed)..."

          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" >"$RUNNER_TEMP/keystore-list.txt" 2>"$RUNNER_TEMP/keytool-error.txt"; then
            echo "ERROR: Cannot open the decoded keystore with ANDROID_SIGNING_STORE_PASSWORD."
            echo "The Base64 secret and STORE_PASSWORD do not belong to the same keystore, or the keystore format is unsupported."
            if grep -qiE 'password|keystore|tampered|integrity|format|invalid' "$RUNNER_TEMP/keytool-error.txt"; then
              sed -E 's/(password|storepass|keystore password)[^.]*/\1 [REDACTED]/Ig' "$RUNNER_TEMP/keytool-error.txt" | head -n 3
            fi
            exit 1
          fi

          detected_alias="$(awk -F, '/PrivateKeyEntry|SecretKeyEntry|trustedCertEntry/ {print $1; exit}' "$RUNNER_TEMP/keystore-list.txt" | xargs || true)"

          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>"$RUNNER_TEMP/alias-error.txt"; then
            echo "ERROR: Keystore password is valid, but alias '$KEY_ALIAS' was not found or is not accessible."
            if [ -n "$detected_alias" ]; then
              echo "Detected first keystore alias: $detected_alias"
              echo "Set ANDROID_SIGNING_KEY_ALIAS to that alias, or regenerate the central secrets from the existing keystore."
            else
              echo "No usable signing alias could be detected."
            fi
            exit 1
          fi

          echo "Source signing keystore validated successfully."
          echo "Keystore alias validated: $KEY_ALIAS"

      - name: Sync signing secrets
        env:
          GH_TOKEN: ${{ secrets.APKSIGN_SYNC_TOKEN }}
          KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          KEY_ALIAS="${KEY_ALIAS:-khahdihdz-release}"

          owner="khahdihdz"
          central="khahdihdz/apksign"

          gh repo list "$owner" --limit 1000 --json nameWithOwner,isArchived             --jq '.[] | select(.isArchived == false) | .nameWithOwner' > repos.txt

          while IFS= read -r repo; do
            [ "$repo" = "$central" ] && continue

            default_branch="$(gh api "repos/$repo" --jq '.default_branch')"
            tree="$(gh api "repos/$repo/git/trees/$default_branch?recursive=1" 2>/dev/null || true)"
            [ -n "$tree" ] || continue

            manifest="$(printf '%s' "$tree" | jq -r '
              .tree[]?
              | select(.type == "blob")
              | select(.path | endswith("src/main/AndroidManifest.xml"))
              | .path
            ' | head -n 1)"

            [ -n "$manifest" ] || continue

            echo "Syncing Android signing secrets to $repo"

            gh secret set ANDROID_SIGNING_KEYSTORE_BASE64 --repo "$repo" --body "$KEYSTORE"
            gh secret set ANDROID_SIGNING_STORE_PASSWORD --repo "$repo" --body "$STORE_PASSWORD"
            gh secret set ANDROID_SIGNING_KEY_ALIAS --repo "$repo" --body "$KEY_ALIAS"
            gh secret set ANDROID_SIGNING_KEY_PASSWORD --repo "$repo" --body "$KEY_PASSWORD"

            echo "Synced: $repo"
          done < repos.txt
